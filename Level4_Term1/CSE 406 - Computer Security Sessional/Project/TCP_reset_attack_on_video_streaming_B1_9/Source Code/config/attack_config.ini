# TCP Reset Attack Configuration
# Educational purposes only - BUET CSE406 Project

[NETWORK]
# Target IP - Windows machine for YouTube attack
TARGET_IP = 10.18.34.106

# Gateway IP - Windows gateway
GATEWAY_IP = 10.18.34.1

# YouTube server IP (will be detected automatically)
# Common YouTube IPs for testing: 172.217.0.0/16, 216.58.0.0/16
SERVER_IP = auto

# Network interface - eth0 for internet traffic
INTERFACE = eth0

[ATTACK]
# ARP poisoning interval (seconds)
ARP_INTERVAL = 2

# RST injection delay (milliseconds)
RST_DELAY = 50

# Maximum packets to inject per connection
MAX_RST_PACKETS = 3

# Monitor duration (seconds, 0 = infinite)
MONITOR_DURATION = 0

[DETECTION]
# Video streaming ports to monitor
VIDEO_PORTS = 443,80,8080

# Minimum packet size to consider as video data
MIN_VIDEO_PACKET_SIZE = 1400

# Connection tracking timeout (seconds)
CONNECTION_TIMEOUT = 300

[LOGGING]
# Log level: DEBUG, INFO, WARNING, ERROR
LOG_LEVEL = INFO

# Log file location
LOG_FILE = logs/attack.log

# Enable packet capture logging
CAPTURE_PACKETS = false

[SAFETY]
# Enable safety checks
ENABLE_SAFETY = true

# Only attack localhost/lab networks
RESTRICT_TO_LOCAL = true

# Maximum attack duration (minutes)
MAX_DURATION = 30
