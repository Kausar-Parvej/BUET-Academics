# TCP Reset Attack Configuration - Demo Mode
# For local demonstration on WSL2

[NETWORK]
# Target IP - localhost for demo
TARGET_IP = 127.0.0.1

# Gateway IP - localhost for demo  
GATEWAY_IP = 127.0.0.1

# Server IP - auto detect
SERVER_IP = auto

# Network interface - loopback for demo
INTERFACE = lo

[ATTACK]
# ARP poisoning interval (seconds) - disabled for local demo
ARP_INTERVAL = 2

# RST injection delay (milliseconds)
RST_DELAY = 10

# Maximum packets to inject per connection
MAX_RST_PACKETS = 5

# Monitor duration (seconds, 0 = infinite)
MONITOR_DURATION = 0

[DETECTION]
# Video streaming ports to monitor - include demo server port
VIDEO_PORTS = 8080,80,443

# Minimum packet size to consider as video data - lower for demo
MIN_VIDEO_PACKET_SIZE = 500

# Connection tracking timeout (seconds)
CONNECTION_TIMEOUT = 300

[LOGGING]
# Log level: DEBUG, INFO, WARNING, ERROR
LOG_LEVEL = DEBUG

# Log file location
LOG_FILE = logs/demo_attack.log

# Enable packet capture logging
CAPTURE_PACKETS = true

[SAFETY]
# Enable safety checks - disabled for demo
ENABLE_SAFETY = false

# Only attack localhost/lab networks
RESTRICT_TO_LOCAL = true

# Maximum attack duration (minutes) - short for demo
MAX_DURATION = 5
